name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * SUN"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  paths:
    name: Detect changes
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # for checkout and changed files
      pull-requests: read # for changed files
    outputs:
      build: ${{ steps.filter.outputs.build }}
      docs: ${{ steps.filter.outputs.docs }}
      test: ${{ steps.filter.outputs.test }}
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release-affecting files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ci: &ci
              - 'mise.toml'
              - 'mise.lock'
              - '.github/workflows/ci.yml'
            docs:
              - *ci
              - 'docs/**'
              - 'tasks.toml'
            build: &build
              - *ci
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/**'
              - '.github/workflows/release.yml'
              - 'dist-workspace.toml'
            test:
              - *ci
              - *build
              - 'biwa.usage.kdl'
              - 'docker-compose.yml'
              - 'pitchfork.toml'
              - 'schema/config.json'
              - 'schema/fixtures/**'
              - 'tasks/start-ssh-server'
              - 'tests/**'
              - 'tarpaulin.toml'
              - 'tasks.toml'
            schema:
              - *ci
              - 'schema/**'
              - 'tasks/schema/**'
              - 'tasks.toml'
  pr-title:
    name: Lint PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # for semantic PR title linting
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # always sync with release-plz.toml
          # `Revert` or `Reapply` PR titles can't be parsed
          # ref: https://github.com/amannn/action-semantic-pull-request/issues/278
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            style
            build
            ci
            chore
            revert
  test:
    name: Test
    needs:
      - paths
    if: ${{ !cancelled() && !failure() && needs.paths.outputs.test == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # for checkout
      id-token: write # for codecov
    env:
      MISE_RUSTUP_HOME: /home/runner/.local/share/mise/rustup
      MISE_CARGO_HOME: /home/runner/.local/share/mise/cargo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.2
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
      - name: Test (coverage)
        run: mise run test:coverage
      - name: Show SSH service logs
        if: failure()
        run: pitchfork logs ssh-server --raw --no-pager
      - name: Stop SSH test services
        if: always()
        run: pitchfork stop ssh-server
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./cobertura.xml
          fail_ci_if_error: true
          use_oidc: true
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # for checkout
    env:
      MISE_RUSTUP_HOME: /home/runner/.local/share/mise/rustup
      MISE_CARGO_HOME: /home/runner/.local/share/mise/cargo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.2
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
      - name: Render
        run: mise run --jobs 1 --continue-on-error render
      - name: Lint
        run: mise run --jobs 1 --continue-on-error check --lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # runs after Lint so that drift does not hide hk findings
      - name: Check generated files are up to date
        if: ${{ !cancelled() }}
        run: |
          # --intent-to-add records untracked files so they show up in `git diff HEAD`
          # compare against HEAD, not the index, since `git add` also stages deletions
          git add --intent-to-add .
          if git diff HEAD --exit-code --stat; then
            exit 0
          fi
          git diff HEAD || true
          echo "::error::Generated files are out of date. Run \`mise run render\` (and \`cargo build\` if \`Cargo.lock\` changed) and commit the result."
          exit 1
  schema:
    name: Schema
    needs:
      - paths
    if: ${{ !cancelled() && !failure() && needs.paths.outputs.schema == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MISE_RUSTUP_HOME: /home/runner/.local/share/mise/rustup
      MISE_CARGO_HOME: /home/runner/.local/share/mise/cargo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.2
      - name: Validate schema
        run: mise run schema
  build:
    name: Build
    needs:
      - paths
    if: ${{ !cancelled() && !failure() && needs.paths.outputs.build == 'true' }}
    # All permissions in the callee workflow are required for the reusable workflow
    permissions:
      contents: write # for release checkout and GitHub release creation
      attestations: write # for release artifact attestations
      id-token: write # for release artifact attestations
      actions: read # for release artifact downloads
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ yet.
  docs:
    name: Build docs
    needs:
      - paths
    if: ${{ always() && !cancelled() && !failure() && (needs.paths.outputs.docs == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # for checkout
    env:
      MISE_ENABLE_TOOLS: bun,node
      MISE_RUSTUP_HOME: /home/runner/.local/share/mise/rustup
      MISE_CARGO_HOME: /home/runner/.local/share/mise/cargo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.2
      - name: Build docs
        run: mise run docs:build
      - name: Validate production build
        uses: risu729/wrangler-deploy-action@db82fbec0db564950f5c319292aab124896d74f3 # v2.0.0
        with:
          mode: dry-run
          working-directory: docs
          worker: biwa-docs
      - name: Package validated docs
        run: |
          mkdir -p out/docs-artifact
          tar -C docs -czf out/docs-artifact/build.tar.gz .cloudflare/output/v0
          git rev-parse HEAD > out/docs-artifact/revision
          (cd out/docs-artifact && sha256sum build.tar.gz revision > SHA256SUMS)
      - name: Upload validated docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-build
          path: out/docs-artifact/
          if-no-files-found: error
          retention-days: 7
  deploy-docs:
    name: Deploy validated docs
    needs: [docs, lint, test, schema, build]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.docs.result == 'success' && needs.lint.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: docs-production
      cancel-in-progress: false
    permissions:
      contents: read # for checkout
    env:
      MISE_ENABLE_TOOLS: bun,node
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.2
      - name: Install locked deployment dependencies
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Download validated docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-build
          path: out/docs-artifact/
      - name: Verify and restore docs
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          (cd out/docs-artifact && sha256sum --check SHA256SUMS)
          [[ "$(cat out/docs-artifact/revision)" == "${EXPECTED_REVISION}" ]]
          tar -C docs -xzf out/docs-artifact/build.tar.gz
          jq -e '.buildContext.isPreview == false and .buildContext.mode == "production"' docs/.cloudflare/output/v0/config.json
          jq -e '.name == "biwa-docs"' docs/.cloudflare/output/v0/workers/default/worker.config.json
      - name: Deploy validated docs
        uses: risu729/wrangler-deploy-action@db82fbec0db564950f5c319292aab124896d74f3 # v2.0.0
        with:
          mode: production
          working-directory: docs
          worker: biwa-docs
          deploy-triggers: "false"
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ci-check:
    name: CI Check
    needs:
      - pr-title
      - test
      - lint
      - build
      - schema
      - docs
      - deploy-docs
    if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: exit 1
  actions-timeline:
    name: Generate Actions Timeline
    needs:
      - ci-check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # for actions-timeline
    steps:
      - name: actions-timeline
        uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0

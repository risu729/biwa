min_version = "2026.10.8"

[tools]
rust = { version = "1.99.1", profile = "default" }
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"github:xd009642/tarpaulin" = "0.37.5"
usage = "7.1.1"
hk = "2.8.1"
jactionlint = "v2.1.0"
# used by jactionlint's workflow shell checks
shellcheck = "0.11.0"
ghalint = "1.5.6"
pinact = "5.0.2"
zizmor = "1.31.1"
# required for pipx backend
uv = "0.13.5"
yamllint = "1.38.0"
yamlfmt = "0.21.0"
typos = "1.51.1"
release-plz = "0.3.159"
cargo-dist = "v0.33.1"
bun = "1.4.4"
node = "26.12.1"
oxlint = "1.72.0"
oxfmt = "0.72.0"
pitchfork = "2.32.2"
tombi = "1.9.0"
"npm:ajv-cli" = "5.0.0"
jq = "1.8.2"
yq = "4.54.1"

[settings]
experimental = true
lockfile = true
lockfile_mode = "generate"
lockfile_platforms = [
	"linux-arm64",
	"linux-arm64-musl",
	"linux-x64",
	"linux-x64-musl",
	"macos-arm64",
	"macos-x64",
]

[env]
"_".path = ["target/debug"]

[task_config]
includes = ["tasks.toml", "tasks/"]

[task_templates."ssh-tests"]
depends = ["test:ssh-server"]

[task_templates."ssh-tests".env]
BIWA_TEST_SSH_PORT = { default = "{{ exec(command='pitchfork status ssh-server --json | jq --exit-status --raw-output \".port[0]\"') }}" }
BIWA_TEST_SSH_CAPABLE_PORT = { default = "{{ exec(command='pitchfork status ssh-server --json | jq --exit-status --raw-output \".port[1]\"') }}" }

[deps.bun]
auto = true
dir = "docs"
run = "bun install --frozen-lockfile"

#:schema https://mise.jdx.dev/schema/mise-task.json
# ref: https://mise.jdx.dev/tasks/

[build]
run = "cargo build"
description = "Build the project."

[test]
extends = "ssh-tests"
run = "cargo test"
description = "Run the tests."

["test:coverage"]
extends = "ssh-tests"
run = "cargo tarpaulin"
description = "Run the tests with coverage."

["test:ssh-server"]
run = "pitchfork start ssh-server --quiet"
description = "Start the SSH test servers."

["test:update-snapshot"]
run = "cargo insta test --accept --unreferenced=auto"
description = "Update test snapshots."
tools = { cargo-insta = "1.46.3" }

[check]
usage = '''
flag "--lint" help="Run hk check instead of fix"
'''
run = """
hk \
  {% if usage.lint %}check{% else %}fix --no-stage{% endif %} \
  --all --no-progress --no-fail-fast
"""
description = "Run hk linters and formatters."

["docs:dev"]
run = "bun run vitepress dev"
dir = "docs"
description = "Start VitePress development server."

["docs:render"]
run = "bun run vitepress build"
dir = "docs"
hide = true
description = "Render the complete VitePress site before packaging."

["docs:build"]
depends = ["docs:render"]
run = "bun run cf-vite build"
dir = "docs"
description = "Build VitePress documentation for production."

["docs:build-preview"]
depends = ["docs:render"]
# Both packagers write the same output; serialize them if scheduled together.
wait_for = ["docs:build"]
run = "bun run cf-vite build --preview"
dir = "docs"
description = "Build documentation for a Workers Preview."

["docs:artifact:pack"]
# Archive only the artifact already validated by the deployment action.
run = '''
set -eu
jq -e '.buildContext.isPreview == false and .buildContext.mode == "production"' docs/.cloudflare/output/v0/config.json
jq -e '.name == "biwa-docs"' docs/.cloudflare/output/v0/workers/default/worker.config.json
mkdir -p out/docs-artifact
tar -C docs -czf out/docs-artifact/build.tar.gz .cloudflare/output/v0
git rev-parse HEAD > out/docs-artifact/revision
(cd out/docs-artifact && sha256sum build.tar.gz revision > SHA256SUMS)
'''
description = "Archive the validated production docs without rebuilding."

["docs:artifact:restore"]
run = '''
set -eu
: "${EXPECTED_REVISION:?Expected commit revision is required}"
(cd out/docs-artifact && sha256sum --check SHA256SUMS)
test "$(cat out/docs-artifact/revision)" = "${EXPECTED_REVISION}"
tar -C docs -xzf out/docs-artifact/build.tar.gz
jq -e '.buildContext.isPreview == false and .buildContext.mode == "production"' docs/.cloudflare/output/v0/config.json
jq -e '.name == "biwa-docs"' docs/.cloudflare/output/v0/workers/default/worker.config.json
'''
description = "Verify and restore production docs for EXPECTED_REVISION without rebuilding."

["docs:preview"]
run = "bun run vitepress preview"
dir = "docs"
description = "Preview built VitePress documentation."

[render]
depends = ["render:*"]
description = "Run all render tasks."

["render:schema"]
run = "cargo run --quiet -- schema > schema/config.json"
description = "Generate the configuration schema."

["render:usage"]
run = [
	"cargo run --quiet -- usage > biwa.usage.kdl",
	"rm -rf docs/src/cli && mkdir -p docs/src/cli",
	"usage generate markdown -m --out-dir docs/src/cli --url-prefix /cli --html-encode --file biwa.usage.kdl",
]
description = "Generate usage spec and CLI reference docs."

[schema]
depends = ["schema:*"]
description = "Validate config schema."

["schema:tombi"]
depends = [
	"{% if env.CI is defined %}{% else %}render:schema{% endif %}",
]
run = "tombi lint --error-on-warnings"
dir = "schema"
description = "Validate config schema with Tombi."

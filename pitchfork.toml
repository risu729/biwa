#:schema https://pitchfork.jdx.dev/schema.json

[settings]
general.mise = true

[daemons.ssh-server]
run = "./tasks/start-ssh-server"
port = { expect = [2222, 2223], bump = true }
watch = [
	"docker-compose.yml",
	"tasks/start-ssh-server",
	"tests/fixtures/ssh-capable/Dockerfile"
]
auto = ["start", "stop"]
ready_output = "SSH test servers are ready"

[daemons.docs]
run = "mise run docs:dev -- --port $PORT --strictPort"
port = { expect = [5173], bump = true }
watch = ["docs/package.json", "docs/bun.lock", "docs/.vitepress/config.ts"]
auto = ["start", "stop"]
ready_port = 5173

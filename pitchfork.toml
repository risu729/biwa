#:schema https://pitchfork.jdx.dev/schema.json

[settings]
general.mise = true

[daemons.ssh-server]
run = "./tasks/start-ssh-server"
port = { expect = [2222, 2223], bump = true }
watch = [
	"docker-compose.yml",
	"tasks/start-ssh-server",
	"tests/fixtures/ssh-capable/Dockerfile"
]
auto = ["start", "stop"]
# an image layer transfer occasionally wedges at 0 bytes on CI runners; BuildKit
# retries on errors, not on a stalled body read, so the transfer only recovers
# once the kernel gives up on the TCP connection. relaunching the whole task
# opens fresh connections, which is what makes a rerun succeed instantly.
# `retry` also applies after readiness, so a mid-run compose crash relaunches
# instead of failing outright
retry = 2
ready_output = { pattern = "SSH test servers are ready", timeout = "3m" }

[daemons.docs]
run = "mise run docs:dev -- --port $PORT --strictPort"
port = { expect = [5173], bump = true }
watch = ["docs/package.json", "docs/bun.lock", "docs/.vitepress/config.ts"]
auto = ["start", "stop"]
ready_port = 5173
